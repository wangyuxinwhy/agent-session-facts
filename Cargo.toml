[workspace]
members = ["."]
resolver = "3"

[package]
name = "agent-session-facts"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Extract auditable facts from native Agent runtime session artifacts"
license = "MIT"
readme = "README.md"
publish = false

[[bin]]
name = "agent-session-facts"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "warn"
