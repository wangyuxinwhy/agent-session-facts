[workspace]
members = ["."]
resolver = "3"

[package]
name = "agent-session-facts"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Turn native Agent Session logs into auditable cross-runtime JSON facts"
license = "MIT"
readme = "README.md"
repository = "https://github.com/wangyuxinwhy/agent-session-facts"
homepage = "https://wangyuxinwhy.github.io/agent-session-facts/"
documentation = "https://wangyuxinwhy.github.io/agent-session-facts/"
keywords = ["agent", "session", "trace", "codex", "claude"]
categories = ["command-line-utilities", "development-tools"]
publish = ["crates-io"]
include = [
    "/src/**",
    "/tests/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/rust-toolchain.toml",
]

[[bin]]
name = "agent-session-facts"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "warn"
